<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="t d">
<title id="t">Anurag Singh Thakur — Neon Node</title>
<desc id="d">Anurag Singh Thakur. A student interested in Linux kernel optimisations and patches. Every silence has a checksum.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.pale{fill:#eaf6ff}.fg{fill:#c9d6ef}.dim{fill:#7683a8}.cy{fill:#35e8ff}.mg{fill:#ff3df0}.vi{fill:#a58bff}

/* Changed to translateY for upward animation */
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes corePulse{0%,100%{opacity:.85}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes float{0%{transform:translateY(0);opacity:0}18%{opacity:.9}100%{transform:translateY(-110px);opacity:0}}
@keyframes flicker{0%{opacity:0}12%{opacity:1}16%{opacity:.25}24%{opacity:1}32%{opacity:.5}42%,100%{opacity:1}}

/* Typewriter Animations */
@keyframes type-reveal { from { width: 0; } to { width: 165px; } }
@keyframes type-cursor { from { transform: translateX(0); } to { transform: translateX(165px); } }
@keyframes fade-out { to { opacity: 0; } }
.typing-reveal { animation: type-reveal 1.2s steps(17) forwards; }
.typing-cursor { animation: type-cursor 1.2s steps(17) forwards, blink 1.05s step-end infinite, fade-out 0.3s 1.5s forwards; }

/* Echo Typewriter Animations (Delayed to 3.0s to wait for upward slide) */
@keyframes type-reveal-echo { from { width: 0; } to { width: 165px; } }
@keyframes type-cursor-echo { from { transform: translateX(0); } to { transform: translateX(165px); } }
.typing-reveal-echo { animation: type-reveal-echo 1.2s steps(18) 3.0s forwards; }
.typing-cursor-echo { animation: type-cursor-echo 1.2s steps(18) 3.0s forwards, blink 1.05s step-end 3.0s infinite, fade-out 0.3s 4.2s forwards; }

/* Fast glitch */
@keyframes glitchCyan{
  0%,17%,34%,67%,84%,100%{transform:translate(-1px,0);opacity:.18}
  21%{transform:translate(-5px,1px);opacity:.9} 27%{transform:translate(4px,-1px);opacity:.9}
  31%{transform:translate(-2px,0);opacity:.5} 71%{transform:translate(-5px,1px);opacity:.9}
  77%{transform:translate(4px,-1px);opacity:.9} 81%{transform:translate(-2px,0);opacity:.5}
}
@keyframes glitchMagenta{
  0%,17%,34%,67%,84%,100%{transform:translate(1px,0);opacity:.18}
  21%{transform:translate(5px,-1px);opacity:.9} 27%{transform:translate(-4px,1px);opacity:.9}
  31%{transform:translate(2px,0);opacity:.5} 71%{transform:translate(5px,-1px);opacity:.9}
  77%{transform:translate(-4px,1px);opacity:.9} 81%{transform:translate(2px,0);opacity:.5}
}
@keyframes sliceA{
  0%,18%,34%,67%,84%,100%{transform:translateX(0);opacity:0}
  22%{transform:translateX(-18px);opacity:1} 27%{transform:translateX(14px);opacity:1}
  31%{transform:translateX(-6px);opacity:1} 72%{transform:translateX(-16px);opacity:1}
  77%{transform:translateX(12px);opacity:1} 81%{transform:translateX(0);opacity:0}
}
@keyframes sliceB{
  0%,20%,37%,70%,86%,100%{transform:translateX(0);opacity:0}
  24%{transform:translateX(16px);opacity:1} 29%{transform:translateX(-12px);opacity:1}
  33%{transform:translateX(0);opacity:0} 74%{transform:translateX(14px);opacity:1}
  79%{transform:translateX(-10px);opacity:1} 83%{transform:translateX(0);opacity:0}
}
@keyframes sliceC{
  0%,22%,40%,73%,88%,100%{transform:translateX(0);opacity:0}
  26%{transform:translateX(-14px);opacity:1} 31%{transform:translateX(10px);opacity:1}
  35%{transform:translateX(0);opacity:0} 76%{transform:translateX(-12px);opacity:1}
  81%{transform:translateX(8px);opacity:1} 85%{transform:translateX(0);opacity:0}
}
@keyframes nameJitter{
  0%,17%,34%,67%,84%,100%{transform:translateX(0)}
  21%{transform:translateX(-2px)} 27%{transform:translateX(2px)} 31%{transform:translateX(-1px)}
  71%{transform:translateX(2px)} 77%{transform:translateX(-2px)} 81%{transform:translateX(1px)}
}
@keyframes nameGlow{
  0%,17%,34%,67%,84%,100%{opacity:.35}
  21%,27%,71%,77%{opacity:.75} 31%,81%{opacity:.5}
}

.ln{animation:fadein .45s ease-out both}
.dot{animation:pulse 2.4s ease-in-out infinite}
.core{animation:corePulse 3.2s ease-in-out infinite}
.spinA{transform-box:view-box;transform-origin:716px 175px;animation:spin 46s linear infinite}
.spinB{transform-box:view-box;transform-origin:716px 175px;animation:spinRev 29s linear infinite}
.name{animation:flicker 1.1s linear 1.4s both, nameJitter 1.6s linear infinite}
.bglow{animation:nameGlow 1.6s linear infinite}
.p{animation:float 9s linear infinite}
.gcyan{animation:glitchCyan 1.6s linear infinite}
.gmag{animation:glitchMagenta 1.6s linear infinite}
.gsliceA{animation:sliceA 1.6s linear infinite}
.gsliceB{animation:sliceB 1.6s linear infinite}
.gsliceC{animation:sliceC 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="bg" cx="76%" cy="46%" r="80%">
<stop offset="0" stop-color="#151233"/><stop offset="45%" stop-color="#0a0819"/><stop offset="100%" stop-color="#050510"/>
</radialGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.25">
<stop offset="0" stop-color="#9df7ff"/><stop offset="42%" stop-color="#35e8ff"/><stop offset="72%" stop-color="#8b6bff"/><stop offset="100%" stop-color="#ff3df0"/>
</linearGradient>
<radialGradient id="sigilGlow">
<stop offset="0" stop-color="#35e8ff" stop-opacity=".20"/><stop offset="55%" stop-color="#8b6bff" stop-opacity=".09"/><stop offset="100%" stop-color="#8b6bff" stop-opacity="0"/>
</radialGradient>
<pattern id="lattice" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M0 22 L22 0 L44 22 L22 44 Z" fill="none" stroke="#8b6bff" stroke-opacity=".13" stroke-width="1"/>
<circle cx="22" cy="22" r="1" fill="#35e8ff" fill-opacity=".25"/>
</pattern>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".20"/></pattern>
<clipPath id="card"><rect x="16" y="16" width="848" height="308"/></clipPath>
<clipPath id="gsA"><rect x="40" y="130" width="620" height="10"/></clipPath>
<clipPath id="gsB"><rect x="40" y="140" width="620" height="7"/></clipPath>
<clipPath id="gsC"><rect x="40" y="147" width="620" height="11"/></clipPath>

<!-- Typewriter Clips -->
<clipPath id="typeclip"><rect class="typing-reveal" x="52" y="80" width="0" height="24"/></clipPath>
<clipPath id="typeclip-echo"><rect class="typing-reveal-echo" x="52" y="268" width="0" height="24"/></clipPath>

<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="tglow" x="-8%" y="-45%" width="116%" height="190%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="nameSharp" x="-6%" y="-30%" width="112%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
<filter id="sglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>

<g id="ringA">
<circle r="104" fill="none" stroke="#35e8ff" stroke-opacity=".20" stroke-width="1"/>
<circle r="88" fill="none" stroke="#35e8ff" stroke-opacity=".55" stroke-width="7" stroke-dasharray="2 20"/>
<path d="M0 -104 L6 -112 L-6 -112 Z" fill="#35e8ff" fill-opacity=".7"/>
<path d="M0 104 L6 112 L-6 112 Z" fill="#35e8ff" fill-opacity=".7"/>
<path d="M104 0 L112 6 L112 -6 Z" fill="#35e8ff" fill-opacity=".7"/>
<path d="M-104 0 L-112 6 L-112 -6 Z" fill="#35e8ff" fill-opacity=".7"/>
</g>
<g id="ringB">
<circle r="72" fill="none" stroke="#ff3df0" stroke-opacity=".40" stroke-width="1" stroke-dasharray="30 12"/>
<path d="M-52 -52 A74 74 0 0 1 52 -52" fill="none" stroke="#8b6bff" stroke-opacity=".55" stroke-width="1.4"/>
<path d="M52 52 A74 74 0 0 1 -52 52" fill="none" stroke="#35e8ff" stroke-opacity=".35" stroke-width="1.4"/>
</g>
</defs>

<rect x="16" y="16" width="848" height="308" fill="url(#bg)"/>
<rect x="16" y="16" width="848" height="308" fill="url(#lattice)"/>

<g clip-path="url(#card)">
<circle class="p" style="animation-delay:-1s;animation-duration:10s" cx="120" cy="286" r="1.8" fill="#35e8ff"/>
<circle class="p" style="animation-delay:-3.4s" cx="248" cy="306" r="1.4" fill="#a58bff"/>
<circle class="p" style="animation-delay:-5.8s;animation-duration:12s" cx="382" cy="292" r="2" fill="#35e8ff"/>
<circle class="p" style="animation-delay:-2.2s" cx="470" cy="314" r="1.3" fill="#ff3df0"/>
<circle class="p" style="animation-delay:-7.1s;animation-duration:11s" cx="566" cy="296" r="1.7" fill="#a58bff"/>
<circle class="p" style="animation-delay:-4.6s" cx="806" cy="304" r="1.5" fill="#35e8ff"/>
<circle class="p" style="animation-delay:-6.3s;animation-duration:13s" cx="690" cy="288" r="1.9" fill="#ff3df0"/>
<circle class="p" style="animation-delay:-0.5s" cx="60" cy="314" r="1.4" fill="#a58bff"/>
</g>

<rect x="16" y="16" width="848" height="34" fill="#35e8ff" fill-opacity=".06"/>
<line x1="16" y1="50" x2="864" y2="50" stroke="#35e8ff" stroke-opacity=".38"/>
<text x="32" y="38" letter-spacing="1.2" class="cy" style="font-size:12px">◈ NODE:RyuOOB</text>
<text x="844" y="38" letter-spacing="1.2" class="dim" text-anchor="end" style="font-size:12px">E2E ENCRYPTED</text>
<circle class="dot" cx="648" cy="34" r="3.5" fill="#35e8ff"/>
<circle class="dot" cx="648" cy="34" r="3.5" fill="#35e8ff" filter="url(#sglow)"/>

<g transform="translate(716 175)">
<circle r="132" fill="url(#sigilGlow)"/>
<polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="#ff3df0" stroke-opacity=".48" stroke-width="1.2"/>
<polygon points="0,-27 23,-13.5 23,13.5 0,27 -23,13.5 -23,-13.5" fill="#8b6bff" fill-opacity=".07" stroke="#8b6bff" stroke-opacity=".35" stroke-width="1"/>
<g stroke="#35e8ff" stroke-opacity=".35" stroke-width="1">
<line x1="-122" y1="0" x2="-112" y2="0"/><line x1="122" y1="0" x2="112" y2="0"/>
<line x1="0" y1="-122" x2="0" y2="-112"/><line x1="0" y1="122" x2="0" y2="112"/>
</g>
<circle class="core" r="9" fill="#35e8ff" filter="url(#sglow)"/>
<circle r="3.5" fill="#eaf6ff"/>
</g>
<use href="#ringA" x="716" y="175" class="spinA"/>
<use href="#ringB" x="716" y="175" class="spinB"/>

<!-- Typing Command 1 -->
<g>
  <g clip-path="url(#typeclip)">
    <text x="52" y="96" class="dim"><tspan class="cy">$</tspan> whoami <tspan class="vi">--RyuOOB</tspan></text>
  </g>
  <rect class="typing-cursor" x="52" y="82" width="8" height="15" fill="#35e8ff"/>
</g>

<!-- NAME -->
<g class="name" font-size="42" font-weight="800" letter-spacing="2">
  <text class="bglow" x="52" y="158" fill="#35e8ff" opacity=".35" filter="url(#nameSharp)">ANURAG SINGH THAKUR</text>
  <g class="gcyan"><text x="52" y="158" fill="#35e8ff">ANURAG SINGH THAKUR</text></g>
  <g class="gmag"><text x="52" y="158" fill="#ff3df0">ANURAG SINGH THAKUR</text></g>
  <g clip-path="url(#gsA)" class="gsliceA"><text x="52" y="158" fill="#35e8ff">ANURAG SINGH THAKUR</text></g>
  <g clip-path="url(#gsB)" class="gsliceB"><text x="52" y="158" fill="#ff3df0">ANURAG SINGH THAKUR</text></g>
  <g clip-path="url(#gsC)" class="gsliceC"><text x="52" y="158" fill="url(#nameGrad)">ANURAG SINGH THAKUR</text></g>
  <text x="52" y="158" fill="url(#nameGrad)">ANURAG SINGH THAKUR</text>
</g>

<!-- Details (Slide Upwards) -->
<g class="ln" style="animation-delay:1.8s"><text class="fg" x="52" y="202"><tspan class="mg">»</tspan> A Student</text></g>
<g class="ln" style="animation-delay:2.0s"><text class="fg" x="52" y="226"><tspan class="mg">»</tspan> Interested in Linux Kernel Optimisations and Patches</text></g>
<g class="ln" style="animation-delay:2.2s"><text class="fg" x="52" y="250"><tspan class="mg">»</tspan> Every Silence has <tspan class="cy" font-weight="700">a Checksum.</tspan></text></g>

<!-- Typing Command 2 (Delayed to start after details finish animating) -->
<g>
  <g clip-path="url(#typeclip-echo)">
    <text x="52" y="284" class="dim"><tspan class="cy">$</tspan> echo <tspan class="vi">$my_socials</tspan></text>
  </g>
  <rect class="typing-cursor-echo" x="52" y="270" width="8" height="15" fill="#35e8ff"/>
</g>

<!-- Scanlines & Frame -->
<rect x="16" y="51" width="848" height="273" fill="url(#scan)"/>
<path d="M16 16H864V324H16Z" fill="none" stroke="#35e8ff" stroke-width="3" opacity=".30" filter="url(#glow)"/>
<path d="M16 16H864V324H16Z" fill="none" stroke="#35e8ff" stroke-width="1.2" stroke-opacity=".85"/>
<g fill="none" stroke="#35e8ff" stroke-width="2.2" stroke-opacity=".9">
<path d="M16 44V16H44"/><path d="M836 16H864V44"/>
<path d="M16 296V324H44"/><path d="M836 324H864V296"/>
</g>
</svg>
