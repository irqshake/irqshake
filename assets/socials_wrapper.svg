<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <style>
    /* This animation waits 5.8s for the terminal to finish, then fades the badges in */
    @keyframes badge-fade-in {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .badges {
      opacity: 0;
      animation: badge-fade-in 1s ease-out 5.8s forwards;
    }
  </style>

  <!-- 1. The Terminal (h1) -->
  <image href="./h1.svg" x="0" y="0" width="880" height="420" />

  <!-- 2. The Social Badges (Appear after 5.8s) -->
  <g class="badges">
    <!-- 6 badges, scaled down and evenly spaced -->
    
    <a href="https://github.com/RyuOOB">
      <image href="./github.svg" x="10" y="440" width="135" height="36" />
    </a>
    
    <a href="https://linkedin.com/in/ryuoob">
      <image href="./linkedin.svg" x="155" y="440" width="135" height="36" />
    </a>
    
    <a href="https://x.com/RyuOOB">
      <image href="./x.svg" x="300" y="440" width="135" height="36" />
    </a>
    
    <a href="https://discord.com/users/YOUR_DISCORD_ID">
      <image href="./discord.svg" x="445" y="440" width="135" height="36" />
    </a>
    
    <a href="https://t.me/RyuOOB">
      <image href="./telegram.svg" x="590" y="440" width="135" height="36" />
    </a>
    
    <a href="mailto:your@email.com">
      <image href="./email.svg" x="735" y="440" width="135" height="36" />
    </a>
  </g>
</svg>
