<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-labelledby="t d">
<title id="t">Anurag Singh Thakur — Languages</title>
<desc id="d">Core programming languages: C, Python, Java, and C++.</desc>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.sys { fill: #35e8ff; font-size: 12px; letter-spacing: 1.2px; }
.dim { fill: #7683a8; font-size: 11px; letter-spacing: 1.2px; }
.lbl { fill: #eaf6ff; font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }
.bg-box { fill: #0a0819; stroke: #35e8ff; stroke-opacity: .55; stroke-width: 1.2; }
.accent { stroke-width: 2; stroke-opacity: .9; stroke-linecap: square; }
.dot { r: 2.5; }
</style>
<defs>
  <radialGradient id="bg" cx="76%" cy="46%" r="80%">
    <stop offset="0" stop-color="#151233"/>
    <stop offset="45%" stop-color="#0a0819"/>
    <stop offset="100%" stop-color="#050510"/>
  </radialGradient>
  <pattern id="lattice" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M0 22 L22 0 L44 22 L22 44 Z" fill="none" stroke="#8b6bff" stroke-opacity=".13" stroke-width="1"/>
    <circle cx="22" cy="22" r="1" fill="#35e8ff" fill-opacity=".25"/>
  </pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".20"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<!-- Ambient Background -->
<rect x="16" y="16" width="848" height="118" fill="url(#bg)"/>
<rect x="16" y="16" width="848" height="118" fill="url(#lattice)"/>

<!-- Header -->
<rect x="16" y="16" width="848" height="34" fill="#35e8ff" fill-opacity=".06"/>
<line x1="16" y1="50" x2="864" y2="50" stroke="#35e8ff" stroke-opacity=".38"/>
<text x="32" y="38" class="sys">$  print "Languages" </text>
<text x="844" y="38" class="dim" text-anchor="end">SYSTEMS NOMINAL</text>
<circle cx="648" cy="34" r="3.5" fill="#35e8ff"/>
<circle cx="648" cy="34" r="3.5" fill="#35e8ff" filter="url(#glow)"/>

<!-- Languages Row -->
<g transform="translate(80, 64)">
  
  <!-- C -->
  <g>
    <rect class="bg-box" width="150" height="36" rx="6"/>
    <line class="accent" x1="0" y1="36" x2="45" y2="36" stroke="#00599C"/>
    
    <!-- Official C Logo -->
    <g transform="translate(12, 9) scale(0.75)">
      <path d="M12 0 L22 6 L22 18 L12 24 L2 18 L2 6 Z" fill="#00599C"/>
      <text x="12" y="16" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    </g>

    <text x="42" y="23" class="lbl">C</text>
    <circle class="dot" cx="138" cy="10" fill="#00599C"/>
  </g>

  <!-- Python -->
  <g transform="translate(190, 0)">
    <rect class="bg-box" width="150" height="36" rx="6"/>
    <line class="accent" x1="0" y1="36" x2="45" y2="36" stroke="#3776AB"/>
    
    <!-- Official Python Logo -->
    <g transform="translate(12, 9) scale(0.75)">
      <path d="M11.89 0c-1.11 0-2.09.06-3.07.17C7.12.57 6.02 1.66 6.02 3.38v2.65h5.88v.95H2.92c-1.73 0-3.25.94-3.73 2.8-.55 2.12-.57 3.44 0 5.69.42 1.66 1.42 2.8 3.15 2.8h2.04v-3.45c0-1.96 1.71-3.73 3.73-3.73h5.86c1.58 0 2.8-1.31 2.8-2.88V3.38c0-1.51-1.25-2.62-2.8-2.93C13.9.13 13.06 0 11.89 0zM8.57 1.68a1 1 0 110 2 1 1 0 010-2z" fill="#3776AB"/>
      <path d="M12.11 24c1.11 0 2.09-.06 3.07-.17 1.7-.4 2.8-1.49 2.8-3.21v-2.65h-5.88v-.95h9.05c1.73 0 3.25-.94 3.73-2.8.55-2.12.57-3.44 0-5.69-.42-1.66-1.42-2.8-3.15-2.8h-2.04v3.45c0 1.96-1.71 3.73-3.73 3.73H10.1c-1.58 0-2.8 1.31-2.8 2.88v4.83c0 1.51 1.25 2.62 2.8 2.93.99.26 1.83.39 3 .39zM15.43 22.32a1 1 0 110-2 1 1 0 010 2z" fill="#FFD43B"/>
    </g>

    <text x="42" y="23" class="lbl">PYTHON</text>
    <circle class="dot" cx="138" cy="10" fill="#3776AB"/>
  </g>

  <!-- Java -->
  <g transform="translate(380, 0)">
    <rect class="bg-box" width="150" height="36" rx="6"/>
    <line class="accent" x1="0" y1="36" x2="45" y2="36" stroke="#ED8B00"/>
    
    <!-- Official Java Logo (Coffee Cup + Steam) -->
    <g transform="translate(12, 9) scale(0.75)">
      <path d="M12,21.3c0,0-1.4,1.1-0.8,2.1c0.6,1,2.1,1.6,4.2,1.6c3.5,0,6.5-1.4,6.5-1.4s-2.4,1.1-5.6,1.1c-2.1,0-3.6-0.6-3.6-1.4c0-0.5,0.3-0.9,0.8-1.4L12,21.3z" fill="#5382A1"/>
      <path d="M9.5,16.8c0,0-1.6,1.2-1,2.2c0.6,1,3.5,1.2,5.8,0.9c2.3-0.3,4.8-1.4,4.8-1.4s-1.8,0.9-4.2,1.2c-2.4,0.3-4.6,0.1-4.6-0.7c0-0.5,0.4-1,0.8-1.4L9.5,16.8z" fill="#5382A1"/>
      <path d="M11.5,10c0,0,2.5,1,1.5,3c-0.8,1.5-1.5,2.2-1.5,2.2s2.5-0.5,2.5-2.5C14,10.5,11.5,10,11.5,10z" fill="#E76F00"/>
      <path d="M9.5,0c0,0,3,3-1.5,6.5C5.5,8.5,7.5,10,7.5,10s-2.5-1.5-0.5-3.5C9.5,4.5,9.5,0,9.5,0z" fill="#E76F00"/>
      <path d="M19.5,8c0,0,2,1.5,0.5,3.5c0,0-1.5,1.5-1.5,1.5s3-0.5,3-2.5C21.5,8.5,19.5,8,19.5,8z" fill="#E76F00"/>
      <path d="M8,8c0,0-1.5,1.5-3,1.5c-1,0-1.5-0.5-1.5-1s0.5-1,1.5-1C6.5,7.5,8,8,8,8z" fill="#E76F00"/>
      <path d="M18.5,16.5c0,0-2,1.5-4.5,1.5c-1.5,0-2.5-0.5-2.5-1.5c0-1,1-1.5,2.5-1.5c0.5,0,1,0.1,1,0.1s-1.5-1-3.5-1C9,14.1,7.5,15.5,7.5,17c0,2,1.5,3.5,4.5,3.5c3.5,0,6.5-2.5,6.5-2.5V16.5z" fill="#5382A1"/>
    </g>

    <text x="42" y="23" class="lbl">JAVA</text>
    <circle class="dot" cx="138" cy="10" fill="#ED8B00"/>
  </g>

  <!-- C++ -->
  <g transform="translate(570, 0)">
    <rect class="bg-box" width="150" height="36" rx="6"/>
    <line class="accent" x1="0" y1="36" x2="45" y2="36" stroke="#f34b7d"/>
    
    <!-- Official C++ Logo -->
    <g transform="translate(12, 9) scale(0.75)">
      <path d="M12 0 L22 6 L22 18 L12 24 L2 18 L2 6 Z" fill="#00599C"/>
      <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">C++</text>
    </g>

    <text x="42" y="23" class="lbl">C++</text>
    <circle class="dot" cx="138" cy="10" fill="#f34b7d"/>
  </g>

</g>

<!-- Scanlines & Frame -->
<rect x="16" y="51" width="848" height="83" fill="url(#scan)"/>
<path d="M16 16H864V134H16Z" fill="none" stroke="#35e8ff" stroke-width="3" opacity=".30" filter="url(#glow)"/>
<path d="M16 16H864V134H16Z" fill="none" stroke="#35e8ff" stroke-width="1.2" stroke-opacity=".85"/>
<g fill="none" stroke="#35e8ff" stroke-width="2.2" stroke-opacity=".9">
  <path d="M16 44V16H44"/><path d="M836 16H864V44"/>
  <path d="M16 106V134H44"/><path d="M836 134H864V106"/>
</g>
</svg>
