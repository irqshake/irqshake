<svg xmlns="http://www.w3.org/2000/svg" width="176" height="64" viewBox="0 0 176 64" role="img" aria-label="Discord">
  <defs>
    <!-- Gradient from h1.svg -->
    <radialGradient id="bg" cx="76%" cy="46%" r="80%">
      <stop offset="0" stop-color="#151233"/><stop offset="45%" stop-color="#0a0819"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <!-- Lattice from h1.svg -->
    <pattern id="lattice" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 22 L22 0 L44 22 L22 44 Z" fill="none" stroke="#8b6bff" stroke-opacity=".13" stroke-width="1"/>
      <circle cx="22" cy="22" r="1" fill="#35e8ff" fill-opacity=".25"/>
    </pattern>
    <!-- Scanlines from h1.svg -->
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".20"/></pattern>
    <!-- Glow from h1.svg -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Background Layers (Full rectangle so the top-right corner is filled) -->
  <rect x="0" y="0" width="176" height="64" fill="url(#bg)" />
  <rect x="0" y="0" width="176" height="64" fill="url(#lattice)" />
  <rect x="0" y="0" width="176" height="64" fill="url(#scan)" />

  <!-- Borders (Top, Angled Cut, Right, Bottom. No left border) -->
  <path d="M 0 0 H 156 L 176 20 V 64" fill="none" stroke="#35e8ff" stroke-opacity=".55" stroke-width="1.5" />
  
  <!-- The Diagonal Cut Line (Makes the cut pop) -->
  <line x1="156" y1="0" x2="176" y2="20" stroke="#35e8ff" stroke-width="2" stroke-opacity=".9" />
  
  <!-- Bottom Right Corner Bracket -->
  <path d="M 176 56 V 64 H 168" fill="none" stroke="#35e8ff" stroke-width="2" stroke-opacity=".9" />

  <!-- Right Rail Glow (Starts where the cut ends) -->
  <line x1="176" y1="20" x2="176" y2="64" stroke="#35e8ff" stroke-width="3" opacity=".30" filter="url(#glow)"/>
  <line x1="176" y1="20" x2="176" y2="64" stroke="#35e8ff" stroke-width="1.2" stroke-opacity=".85"/>

