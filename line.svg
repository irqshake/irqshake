<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2">
  <!-- A div wrapper with inline CSS to force the line to be exactly 1px tall -->
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height: 100%; display: flex; align-items: center;">
      <div style="height: 1px; width: 10000px; background-color: #00ff00;"></div>
    </div>
  </foreignObject>
</svg>
